# =============================================================================
# bookstore-frontend — React/Nginx | Port 8080
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-frontend
  namespace: ns-bookstoreapp
  labels:
    app: bookstore-frontend
    app.kubernetes.io/part-of: bookstoreapp
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstore-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bookstore-frontend
        version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: bookstore-frontend
          image: mokadir/bookstore-frontend:9
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: REACT_APP_API_URL
              value: "/api"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-tmp
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-frontend
  namespace: ns-bookstoreapp
  labels:
    app: bookstore-frontend
spec:
  selector:
    app: bookstore-frontend
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30022
      protocol: TCP
