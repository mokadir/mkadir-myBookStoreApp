# =============================================================================
# bookstore-mongodb — MongoDB 7 | Port 27017
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bookstore-mongodb-pv
  namespace: ns-bookstoreapp
  labels:
    app: bookstore-mongodb
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/bookstore-mongodb"
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstore-mongodb-pvc
  namespace: ns-bookstoreapp
  labels:
    app: bookstore-mongodb
    app.kubernetes.io/part-of: bookstoreapp
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-mongodb
  namespace: ns-bookstoreapp
  labels:
    app: bookstore-mongodb
    app.kubernetes.io/part-of: bookstoreapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstore-mongodb
  template:
    metadata:
      labels:
        app: bookstore-mongodb
    spec:
      containers:
        - name: bookstore-mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: bookstore
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: bookstore-mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-mongodb
  namespace: ns-bookstoreapp
  labels:
    app: bookstore-mongodb
spec:
  selector:
    app: bookstore-mongodb
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017