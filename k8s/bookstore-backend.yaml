# =============================================================================
# bookstore-backend — Node.js/Express API | Port 5000
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-backend
  namespace: ns-bookstoreapp
  labels:
    app: bookstore-backend
    app.kubernetes.io/part-of: bookstoreapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstore-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bookstore-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: bookstore-backend
          image: mokadir/bookstore-backend:8
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: "mongodb://bookstore-mongodb:27017/bookstore"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookstoreapp-secrets
                  key: jwt-secret
            - name: JWT_EXPIRE
              value: "7d"
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bookstoreapp-secrets
                  key: stripe-secret-key
            - name: FRONTEND_URL
              value: "http://bookstore-frontend:3000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-backend
  namespace: ns-bookstoreapp
  labels:
    app: bookstore-backend
spec:
  selector:
    app: bookstore-backend
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
